<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Slack RSS Notifier architecture</title>
  <desc id="desc">RSS feeds flow into a Cloudflare Worker, which uses KV to deduplicate articles and sends new articles to a Slack direct message.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#182c48"/></linearGradient>
    <linearGradient id="worker" x1="0" x2="1"><stop stop-color="#f48120"/><stop offset="1" stop-color="#faad3d"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#78dce8"/></marker>
  </defs>
  <rect width="1200" height="520" rx="24" fill="url(#bg)"/>
  <text x="60" y="58" fill="#fff" font-family="Arial,sans-serif" font-size="28" font-weight="700">Gadget news → Slack DM</text>
  <text x="60" y="88" fill="#a8bad2" font-family="Arial,sans-serif" font-size="16">Cloudflare Workers Cron polls feeds, KV prevents duplicate notifications</text>
  <g filter="url(#shadow)">
    <rect x="60" y="145" width="270" height="220" rx="18" fill="#f6f8fb"/>
    <text x="90" y="185" fill="#18243a" font-family="Arial,sans-serif" font-size="20" font-weight="700">RSS / Atom feeds</text>
    <g font-family="Arial,sans-serif" font-size="15" fill="#40516a">
      <text x="95" y="225">◉ The Verge</text><text x="95" y="253">◉ Engadget</text><text x="95" y="281">◉ TechCrunch</text><text x="95" y="309">◉ ギズモード・ジャパン</text><text x="95" y="337">◉ AV Watch / ITmedia</text>
    </g>
    <rect x="455" y="145" width="290" height="220" rx="18" fill="url(#worker)"/>
    <text x="505" y="190" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Cloudflare Worker</text>
    <text x="505" y="230" fill="#fff" font-family="Arial,sans-serif" font-size="16">Cron · Parse · Filter · Notify</text>
    <text x="505" y="270" fill="#fff" font-family="Arial,sans-serif" font-size="15">Newest 5 / feed</text>
    <text x="505" y="298" fill="#fff" font-family="Arial,sans-serif" font-size="15">Slack Bot Token</text>
    <rect x="870" y="145" width="270" height="220" rx="18" fill="#f6f8fb"/>
    <text x="930" y="190" fill="#18243a" font-family="Arial,sans-serif" font-size="24" font-weight="700">Slack DM</text>
    <rect x="920" y="225" width="165" height="76" rx="12" fill="#611f69"/>
    <text x="940" y="252" fill="#fff" font-family="Arial,sans-serif" font-size="14">New gadget article</text>
    <text x="940" y="277" fill="#e8c7eb" font-family="Arial,sans-serif" font-size="12">title + link + date</text>
    <rect x="525" y="410" width="150" height="62" rx="14" fill="#2b4161" stroke="#78dce8" stroke-width="2"/>
    <text x="560" y="448" fill="#fff" font-family="Arial,sans-serif" font-size="18" font-weight="700">KV</text>
    <text x="608" y="448" fill="#a8bad2" font-family="Arial,sans-serif" font-size="13">seen IDs</text>
  </g>
  <path d="M330 255H445" stroke="#78dce8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M755 255H860" stroke="#78dce8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M600 365V400" stroke="#78dce8" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="365" y="238" fill="#a8bad2" font-family="Arial,sans-serif" font-size="14">every hour</text>
  <text x="774" y="238" fill="#a8bad2" font-family="Arial,sans-serif" font-size="14">new only</text>
</svg>
